name: osv-scanner-pr

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions: {}

jobs:
  scan-pr:
    permissions:
      actions: read
      security-events: write # upload results to the Security tab
      contents: read
